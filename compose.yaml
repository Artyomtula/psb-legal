name: psb-legal-assistant

services:
  legal-api:
    build:
      context: .
      args:
        WITH_LOCAL_MODELS: ${WITH_LOCAL_MODELS:-false}
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      INDEX_DIR: /app/artifacts/index
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "${LEGAL_API_PORT:-8000}:8000"
    restart: unless-stopped

  webui:
    image: ${WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.8.12}
    depends_on:
      legal-api:
        condition: service_healthy
    environment:
      WEBUI_NAME: "Юридический ассистент"
      WEBUI_AUTH: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: http://legal-api:8000/v1
      OPENAI_API_KEYS: local
      DEFAULT_MODELS: psb-legal
      DEFAULT_LOCALE: ru-RU
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_WEB_SEARCH: "false"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://legal-api:8000/v1
      RAG_OPENAI_API_KEY: local
      OFFLINE_MODE: "true"
    volumes:
      - webui-data:/app/backend/data
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    restart: unless-stopped

volumes:
  webui-data: {}
